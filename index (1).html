<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salma’s 22nd Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f6;--surface:#ffffff;--ink:#3a1730;--muted:#7d5a70;--accent:#d6336c;--accent2:#ffd36e;--line:#f3cfdb;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#24101f;--surface:#33192c;--ink:#ffeaf1;--muted:#d3a9bd;--accent:#ff7aa5;--accent2:#ffd36e;--line:#5a2b4b;--on-accent:#2a0f20}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#24101f;--surface:#33192c;--ink:#ffeaf1;--muted:#d3a9bd;--accent:#ff7aa5;--accent2:#ffd36e;--line:#5a2b4b;--on-accent:#2a0f20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 60px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.05}
.hero{text-align:center;padding:36px 0 28px}
.hero .age{font:600 clamp(110px,34vw,168px)/0.9 Fraunces,Georgia,serif;color:var(--accent);margin:0}
.hero h1{font-size:clamp(28px,8vw,38px);font-weight:500;font-style:italic}
.hero p{color:var(--muted);margin:10px 0 0}
.when{display:inline-block;margin-top:18px;background:var(--accent2);color:#3a1730;padding:8px 16px;border-radius:999px;font-weight:700}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:22px}
.stop h2{font-size:26px}
.time{color:var(--accent);font-weight:700;margin:0 0 4px}
.place{color:var(--muted);margin:6px 0 0}
.stop a{color:var(--accent)}
.btn{display:inline-block;border:0;border-radius:14px;padding:13px 20px;font:700 16px "DM Sans",sans-serif;background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;margin-top:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.locked{opacity:.6}
.group{margin-top:18px}.group h3{margin:0 0 8px;font-size:17px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;cursor:pointer}
.opt small{display:block;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.surprise{text-align:center;border:2px dashed var(--accent);background:var(--surface);border-radius:22px;padding:34px 22px;margin-top:22px}
.surprise h2{font-size:clamp(30px,9vw,44px);color:var(--accent)}
.surprise p{font-size:18px;white-space:pre-line}
.hide{display:none!important}
.conf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
#editor{margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
#editor label{display:block;font-weight:700;margin-top:12px;font-size:14px}
#editor input,#editor textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
#editor textarea{min-height:110px}
#msg{color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main>
<section class="hero">
  <p id="nick"></p>
  <div class="age" id="age"></div>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <span class="when" id="date"></span>
</section>

<section class="stop" id="s1"></section>
<section class="stop" id="s2"></section>
<section class="surprise hide" id="surprise"></section>

<section id="editor" class="hide">
  <h2>Edit details</h2>
  <p>Only you can see this. Change anything, then save — the link stays the same.</p>
  <div id="fields"></div>
  <button class="btn" id="save">Save changes</button>
  <p id="msg" role="status"></p>
</section>
</main>

<script id="data" type="application/json">
{
 "name": "Salamii",
 "nick": "salamii",
 "age": "22",
 "intro": "I planned a little day just for you. Follow the plan below.",
 "date": "Friday, 13 November 2026",
 "r": {
  "name": "Bremer ",
  "time": "2:30",
  "place": "المنصورة",
  "map": "",
  "note": "Morning stop: lunch is on me. When you get there, tap the button and choose your order."
 },
 "c": {
  "name": "OVN",
  "time": "5:00",
  "place": "المنصورة",
  "map": "https://www.google.com/maps?um=1&ie=UTF-8&fb=1&gl=eg&sa=X&geocode=KQO4L0EAnfcUMYiKSKeGcgeW&daddr=29J4%2BMH2,+Gehan+Al+Sadat,+Mit+Badr+Khamees,+El+Mansoura+1,+Dakahlia+Governorate+7650101",
  "note": "Evening stop. Tap the button once you walk in."
 },
 "menuUrl": "https://bremer-eg.com/",
 "whatsapp": "+201554595668",
 "wish": "Happy Birthday, Salamii! ❤️🎂\n\nWishing you a year full of happiness, success, unforgettable memories, and everything your heart wishes for. Hope your day is as special and amazing as you are. Keep shining and smiling! 🥳❤️"
}
</script>

<script>
var D=JSON.parse(document.getElementById("data").textContent);
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var picks={};
try{picks=JSON.parse(ls("picks")||"{}")}catch(e){picks={}}

function link(m,label){if(!m)return null;var a=el("a",null,label);a.href=m;a.target="_blank";a.rel="noopener";return a}
function head(s,x,time){s.appendChild(el("p","time",time+" · "+D.date.split(",")[0]));s.appendChild(el("h2",null,x.name));var p=el("p","place",x.place);var l=link(x.map,"  Open map");if(l)p.appendChild(l);s.appendChild(p);if(x.note)s.appendChild(el("p","place",x.note))}

function menuGroups(){return D.menu.split("\n").map(function(l){var i=l.indexOf(":");return{g:l.slice(0,i).trim(),items:l.slice(i+1).split(",").map(function(s){return s.trim()}).filter(Boolean)}}).filter(function(g){return g.g&&g.items.length})}

function renderStop1(){
  var s=$("s1");s.textContent="";head(s,D.r,D.r.time);
  if(ls("arr1")!=="1"){var b=el("button","btn","I’m at the restaurant");b.onclick=function(){ls("arr1","1");renderStop1()};s.appendChild(b);return}
  var box=el("div");box.appendChild(el("h3",null,"Choose your order"));
  box.appendChild(el("p","place","Open the menu, pick what you like, then write it below."));
  var m=link(D.menuUrl,"Open the menu");if(m){m.className="btn ghost";box.appendChild(m)}
  var t=el("textarea");t.id="order";t.placeholder="Write your order here…";t.value=ls("order")||"";
  t.style.cssText="display:block;width:100%;min-height:96px;margin-top:14px;padding:12px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit";
  t.oninput=function(){ls("order",t.value)};
  box.appendChild(t);s.appendChild(box);
  var send=el("a","btn","Send my order");send.href="#";
  send.onclick=function(e){var v=t.value.trim();if(!v){e.preventDefault();t.focus();return}
    if(D.whatsapp){send.href="https://wa.me/"+D.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent("Hi! My order: "+v);send.target="_blank";send.rel="noopener"}
    else{e.preventDefault();send.textContent="Order saved ✓"}};
  s.appendChild(send);
}

function renderStop2(){
  var s=$("s2");s.textContent="";head(s,D.c,D.c.time);
  var sp=$("surprise");
  if(ls("arr2")==="1"){s.classList.add("hide");reveal(false);return}
  var b=el("button","btn ghost","I’m at the cafe");b.onclick=function(){ls("arr2","1");s.classList.add("hide");reveal(true)};
  s.appendChild(b);
}
function reveal(boom){
  var sp=$("surprise");sp.textContent="";sp.classList.remove("hide");
  sp.appendChild(el("h2",null,"Surprise!"));sp.appendChild(el("p",null,D.wish));
  if(boom){for(var i=0;i<40;i++){var c=el("span","conf",["🎉","🎂","💖","✨","🎈"][i%5]);c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2.5+Math.random()*3)+"s";c.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(c);setTimeout(function(x){x.remove()},8000,c)}}
}

function render(){
  document.title=D.name+"’s "+D.age+"th Birthday";
  $("nick").textContent="@"+D.nick;$("age").textContent=D.age;
  $("title").textContent="Happy birthday, "+D.name;$("intro").textContent=D.intro;$("date").textContent=D.date;
  renderStop1();renderStop2();
}
render();

/* Owner-only editor */
var FIELDS=[["name","Name"],["nick","Nickname"],["age","Age"],["date","Date"],["intro","Intro line"],
["r.name","Restaurant name"],["r.time","Restaurant time"],["r.place","Restaurant address"],["r.map","Restaurant map link"],["r.note","Restaurant note"],
["c.name","Cafe name"],["c.time","Cafe time"],["c.place","Cafe address"],["c.map","Cafe map link"],["c.note","Cafe note"],
["menuUrl","Menu link"],["whatsapp","Your WhatsApp number with country code (orders get sent here)"],["wish","Surprise message","area"]];
function get(p){var a=p.split(".");return a.length>1?D[a[0]][a[1]]:D[p]}
function set(p,v){var a=p.split(".");if(a.length>1)D[a[0]][a[1]]=v;else D[p]=v}
(async function(){
  try{
    if(!window.claude)return;
    var u=await claude.use("user");if(!u||!u.isOwner())return;
    var a=await claude.use("artifact");if(!a)return;
    $("editor").classList.remove("hide");var f=$("fields");
    FIELDS.forEach(function(x){var l=el("label",null,x[1]);var i=el(x[2]?"textarea":"input");i.id="f_"+x[0];i.value=get(x[0])||"";l.appendChild(i);f.appendChild(l)});
    $("save").onclick=async function(){
      var m=$("msg");m.textContent="Saving…";
      FIELDS.forEach(function(x){set(x[0],$("f_"+x[0]).value)});
      try{
        var src=await (await fetch(location.href.split("#")[0])).text();
        var j=JSON.stringify(D,null,1).replace(/</g,"\\u003c");
        var out=src.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,function(_,s,e){return s+"\n"+j+"\n"+e});
        await a.publish(out);
      }catch(e){m.textContent="Couldn’t save ("+(e&&e.code||"error")+"). Ask Claude to apply your changes."}
    };
  }catch(e){}
})();
</script>
</body>
</html>
