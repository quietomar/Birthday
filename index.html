<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Salma’s 22nd Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Figtree:wght@400;500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow invitation column. Blush paper, wine ink, champagne gold. A ringed "22" opens the page, a dashed route links the two stops, one dark wine card holds the surprise. */
:root{
  --bg:#fcecef;--surface:#fffafb;--ink:#2e1020;--muted:#785466;
  --accent:#b3124f;--accent-deep:#82103a;--gold:#c9973f;--line:#efc6d2;--on-accent:#ffffff;
  --glow:rgba(179,18,79,.16);--shadow:rgba(130,16,58,.38);
  --card-bg:#3a0f26;--card-ink:#ffeff4;--card-gold:#f1c76f;
  --display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --body:"Figtree","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a0912;--surface:#2b1220;--ink:#ffeef4;--muted:#d6a8ba;
  --accent:#ff86ae;--accent-deep:#e8588a;--gold:#f1c76f;--line:#4a2138;--on-accent:#2a0d1b;
  --glow:rgba(255,134,174,.16);--shadow:rgba(0,0,0,.6);
  --card-bg:#4a1531;--card-ink:#fff0f5;--card-gold:#f6d283;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a0912;--surface:#2b1220;--ink:#ffeef4;--muted:#d6a8ba;
  --accent:#ff86ae;--accent-deep:#e8588a;--gold:#f1c76f;--line:#4a2138;--on-accent:#2a0d1b;
  --glow:rgba(255,134,174,.16);--shadow:rgba(0,0,0,.6);
  --card-bg:#4a1531;--card-ink:#fff0f5;--card-gold:#f6d283;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding-block:20px 88px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.hide{display:none!important}

/* Hero */
.hero{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 34px}
.hero::before{content:"";position:absolute;z-index:-1;left:50%;top:-20px;width:min(130vw,640px);aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.handle{margin:0;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);font:700 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase}
.badge{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:22px 0 14px;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 70s linear infinite}
.ring circle{fill:none;stroke:var(--line);stroke-width:1}
.ring text{fill:var(--muted);font:700 10.5px var(--body);letter-spacing:.18em}
.age{position:relative;margin:0;padding:0 .1em .08em;font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(88px,30vw,128px);line-height:1;color:var(--accent);background:linear-gradient(160deg,var(--accent) 35%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero h1{margin:0;max-width:20ch;font:italic 500 clamp(26px,7.2vw,34px)/1.15 var(--display);text-wrap:balance}
.intro{margin:12px 0 0;max-width:36ch;color:var(--muted);text-wrap:pretty}
.datepill{margin:20px 0 0;padding:9px 18px;border:1px solid var(--gold);border-radius:999px;background:color-mix(in srgb,var(--gold) 14%,transparent);font:700 12.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase}

/* Plan */
.sec{display:flex;align-items:center;gap:14px;margin:6px 0 20px;font:700 12px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.plan{list-style:none;margin:0;padding:0 0 0 30px;display:grid;gap:20px;position:relative}
.plan::before{content:"";position:absolute;left:8px;top:26px;bottom:26px;border-left:2px dashed var(--line)}
.stop{position:relative;min-width:0;padding:20px 20px 22px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 18px 32px -26px var(--shadow)}
.stop::before{content:"";position:absolute;left:-30px;top:25px;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--bg)}
.stop::after{content:"";position:absolute;left:-24px;top:31px;width:6px;height:6px;border-radius:50%;background:var(--surface)}
.time{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0}
.time b{font:700 36px/1 var(--display);color:var(--accent);font-variant-numeric:lining-nums}
.time span{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stop h2{margin:12px 0 0;font:600 29px/1.1 var(--display);text-wrap:balance}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 0;color:var(--muted)}
.where svg{width:17px;height:17px;flex:none;color:var(--accent)}
.where span{min-width:0}
.chip{display:inline-flex;align-items:center;padding:6px 13px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font:700 13.5px/1.2 var(--body);text-decoration:none}
.note{margin:12px 0 0;color:var(--muted);text-wrap:pretty}
.here{display:inline-flex;align-items:center;gap:9px;margin:16px 0 0;font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.here i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-out infinite}
.actions{margin-top:18px}
.order{margin-top:16px;padding-top:18px;border-top:1px dashed var(--line);display:grid;gap:14px}
.order p{margin:0;color:var(--muted)}
.lab{display:block;margin-bottom:8px;font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase}
.order textarea{display:block;width:100%;min-height:108px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.order textarea:focus{border-color:var(--accent);outline:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border:2px solid var(--accent);border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 16px/1 var(--body);text-decoration:none;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.block{width:100%}
@media (hover:hover){.btn:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}.btn.ghost:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:var(--accent)}.chip:hover{border-color:var(--accent)}}

/* Surprise */
.surprise{position:relative;overflow:hidden;margin-top:26px;padding:42px 26px 30px;border-radius:26px;background:radial-gradient(110% 80% at 90% 0%,color-mix(in srgb,var(--card-gold) 24%,transparent),transparent 62%),var(--card-bg);color:var(--card-ink);box-shadow:0 30px 50px -34px var(--shadow)}
.surprise>*{position:relative;animation:rise .7s both}
.surprise .kicker{margin:0;font:700 12px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--card-gold)}
.surprise h2{margin:14px 0 0;font:italic 700 clamp(44px,13vw,60px)/1 var(--display);color:var(--card-gold);animation-delay:.1s}
.surprise .wish{margin:20px 0 0;font-size:18px;line-height:1.65;white-space:pre-line;text-wrap:pretty;animation-delay:.2s}
.surprise .btn{margin-top:24px;border-color:var(--card-gold);color:var(--card-gold);background:transparent;animation-delay:.3s}
.surprise .mark{position:absolute;right:-8px;bottom:-34px;margin:0;font:italic 700 210px/1 var(--display);color:var(--card-gold);opacity:.08;pointer-events:none;animation:none}
@media (hover:hover){.surprise .btn:hover{background:var(--card-gold);color:var(--card-bg);border-color:var(--card-gold)}}

/* Gate, music, confetti */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px));background:radial-gradient(70% 50% at 50% 40%,var(--glow),transparent),var(--bg);cursor:pointer;transition:opacity .5s}
#gate.out{opacity:0;pointer-events:none}
#gate .for{margin:0;font:700 12px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
#gate h2{margin:0;font:italic 500 clamp(30px,8.5vw,42px)/1.1 var(--display);text-wrap:balance}
.gift{width:116px;height:116px;margin-bottom:6px;transform-origin:50% 90%;animation:wig 2.6s ease-in-out infinite}
.gift .box{fill:var(--accent)}.gift .lid{fill:var(--accent-deep)}.gift .rib,.gift .bow{fill:var(--gold)}
#mus{position:fixed;z-index:10;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);cursor:pointer;box-shadow:0 10px 22px -12px var(--shadow)}
#mus svg{width:22px;height:22px}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}

/* Owner editor */
#editor{margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
#editor h2{margin:0;font:600 24px/1.1 var(--display)}
#editor>p{margin:8px 0 0;color:var(--muted)}
#editor label{display:block;margin-top:14px;font:700 13px/1.3 var(--body)}
#editor input,#editor textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
#editor textarea{min-height:120px}
#editor .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
#editor .row .btn{margin:0}
#msg{margin:12px 0 0;color:var(--muted)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes wig{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-6deg)}76%{transform:rotate(5deg)}84%{transform:rotate(-3deg)}92%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.ring,.gift,.here i,.surprise>*{animation:none}#gate{transition:none}}
</style>

</head>
<body>
<main>
<header class="hero">
  <p class="handle" id="nick"></p>
  <div class="badge" id="badge"><div class="age" id="age"></div></div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <p class="datepill" id="date"></p>
</header>

<h2 class="sec">The plan</h2>
<ol class="plan">
  <li class="stop" id="s1"></li>
  <li class="stop" id="s2"></li>
</ol>
<section class="surprise hide" id="surprise"></section>

<section id="editor" class="hide">
  <h2>Edit details</h2>
  <p>Only you can see this. Change anything, then save. The link stays the same.</p>
  <div id="fields"></div>
  <div class="row">
    <button class="btn" id="save" type="button">Save changes</button>
    <button class="btn ghost" id="reset" type="button">Reset my progress</button>
  </div>
  <p id="msg" role="status"></p>
</section>
</main>

<div id="gate">
  <svg class="gift" viewBox="0 0 120 120" aria-hidden="true"><path class="bow" d="M60 42C44 12 14 22 40 42Z"/><path class="bow" d="M60 42C76 12 106 22 80 42Z"/><rect class="lid" x="14" y="40" width="92" height="20" rx="5"/><rect class="box" x="22" y="58" width="76" height="52" rx="4"/><rect class="rib" x="54" y="40" width="12" height="70"/><circle class="rib" cx="60" cy="42" r="7"/></svg>
  <p class="for" id="gfor"></p>
  <h2>A little gift for you</h2>
  <button class="btn" id="open" type="button">Tap to open</button>
</div>
<button id="mus" class="hide" type="button" aria-label="Turn music on or off">
  <svg id="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg id="ico-off" class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
</button>
<canvas id="cf" aria-hidden="true"></canvas>

<script id="data" type="application/json">
{
 "name": "Salamii",
 "nick": "salamii",
 "age": "22",
 "intro": "I planned a little day just for you. Follow the plan below.",
 "date": "Friday, 13 November 2026",
 "r": {
  "name": "Bremer",
  "time": "2:30 PM",
  "place": "المنصورة",
  "map": "",
  "note": "First stop: lunch is on me. When you get there, tap the button and choose your order."
 },
 "c": {
  "name": "OVN",
  "time": "5:00 PM",
  "place": "المنصورة",
  "map": "https://www.google.com/maps?um=1&ie=UTF-8&fb=1&gl=eg&sa=X&geocode=KQO4L0EAnfcUMYiKSKeGcgeW&daddr=29J4%2BMH2,+Gehan+Al+Sadat,+Mit+Badr+Khamees,+El+Mansoura+1,+Dakahlia+Governorate+7650101",
  "note": "Evening stop. Tap the button once you walk in."
 },
 "menuUrl": "https://bremer-eg.com/",
 "whatsapp": "+201554595668",
 "wish": "Happy Birthday, Salamii! ❤️🎂\n\nWishing you a year full of happiness, success, unforgettable memories, and everything your heart wishes for. Hope your day is as special and amazing as you are. Keep shining and smiling! 🥳❤️"
}
</script>

<script>
var D=JSON.parse(document.getElementById("data").textContent);
var NS="http://www.w3.org/2000/svg";
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function lr(k){try{localStorage.removeItem(k)}catch(e){}}
var PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
function icon(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}

function mapUrl(x){
  if(x.map)return x.map;
  var q=[x.name,x.place].join(" ").trim();
  return q?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q):"";
}
function head(s,x){
  var t=el("p","time");t.appendChild(el("b",null,x.time));t.appendChild(el("span",null,D.date.split(",")[0]));s.appendChild(t);
  s.appendChild(el("h2",null,(x.name||"").trim()));
  var w=el("p","where");
  if(x.place){w.appendChild(icon(PIN));var pl=el("span",null,x.place);pl.dir="auto";w.appendChild(pl)}
  var u=mapUrl(x);
  if(u){var a=el("a","chip","Open in Maps");a.href=u;a.target="_blank";a.rel="noopener";w.appendChild(a)}
  if(w.childNodes.length)s.appendChild(w);
  if(x.note)s.appendChild(el("p","note",x.note));
}

function renderStop1(){
  var s=$("s1");s.textContent="";head(s,D.r);
  if(ls("arr1")!=="1"){
    var ac=el("div","actions");
    var b=el("button","btn","I’m at the restaurant");b.type="button";
    b.onclick=function(){ls("arr1","1");renderStop1()};
    ac.appendChild(b);s.appendChild(ac);return;
  }
  var h=el("p","here");h.appendChild(el("i"));h.appendChild(document.createTextNode("You’re here"));s.appendChild(h);
  var box=el("div","order");
  box.appendChild(el("p",null,"Open the menu, pick what you like, then write it below."));
  var m=el("a","btn ghost block","Open the menu");
  if(D.menuUrl){m.href=D.menuUrl;m.target="_blank";m.rel="noopener";box.appendChild(m)}
  var wrap=el("div");var lab=el("label","lab","Your order");lab.htmlFor="order";wrap.appendChild(lab);
  var t=el("textarea");t.id="order";t.placeholder="Write your order here…";t.value=ls("order")||"";
  t.oninput=function(){ls("order",t.value)};
  wrap.appendChild(t);box.appendChild(wrap);
  var send=el("a","btn block","Send my order");send.href="#";
  send.onclick=function(e){
    var v=t.value.trim();
    if(!v){e.preventDefault();t.focus();return}
    if(D.whatsapp){send.href="https://wa.me/"+D.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent("Hi! My order: "+v);send.target="_blank";send.rel="noopener"}
    else{e.preventDefault();send.textContent="Order saved ✓"}
  };
  box.appendChild(send);s.appendChild(box);
}

function renderStop2(){
  var s=$("s2");s.textContent="";head(s,D.c);
  if(ls("arr2")==="1"){s.classList.add("hide");reveal(false);return}
  s.classList.remove("hide");
  var ac=el("div","actions");
  var b=el("button","btn ghost","I’m at the cafe");b.type="button";
  b.onclick=function(){ls("arr2","1");s.classList.add("hide");reveal(true)};
  ac.appendChild(b);s.appendChild(ac);
}

function reveal(boom){
  var sp=$("surprise");sp.textContent="";sp.classList.remove("hide");
  sp.appendChild(el("p","kicker","A message for you"));
  sp.appendChild(el("h2",null,"Surprise!"));
  sp.appendChild(el("p","wish",D.wish));
  var r=el("button","btn","Throw confetti again");r.type="button";r.onclick=confetti;sp.appendChild(r);
  sp.appendChild(el("p","mark",D.age));
  if(boom){confetti();try{sp.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}}
}

function confetti(){
  try{
    if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var c=$("cf"),x=c.getContext("2d"),dpr=Math.min(window.devicePixelRatio||1,2);
    var W=c.width=Math.round(innerWidth*dpr),H=c.height=Math.round(innerHeight*dpr);
    var cols=["#ff86ae","#f1c76f","#b3124f","#ffffff","#ffb3cb","#c9973f"],P=[];
    for(var i=0;i<130;i++)P.push({x:Math.random()*W,y:-Math.random()*H*.7,w:(6+Math.random()*8)*dpr,h:(4+Math.random()*6)*dpr,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3.5)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,c:cols[i%cols.length],round:i%4===0});
    var t0=performance.now();
    (function f(t){
      var dt=t-t0,alive=false;x.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx+Math.sin(p.y/80)*.6*dpr;p.y+=p.vy;p.r+=p.vr;if(p.y<H+20)alive=true;
        x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
        if(p.round){x.beginPath();x.arc(0,0,p.h/2,0,6.28);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        x.restore();
      });
      if(alive&&dt<9000)requestAnimationFrame(f);else x.clearRect(0,0,W,H);
    })(t0);
  }catch(e){}
}

function buildRing(){
  var b=$("badge"),old=b.querySelector(".ring");if(old)old.remove();
  var s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 200 200");s.setAttribute("class","ring");s.setAttribute("aria-hidden","true");
  var d=document.createElementNS(NS,"defs"),p=document.createElementNS(NS,"path");
  p.setAttribute("id","rp");p.setAttribute("d","M12,100a88,88 0 1,1 176,0a88,88 0 1,1 -176,0");d.appendChild(p);s.appendChild(d);
  var c=document.createElementNS(NS,"circle");c.setAttribute("cx","100");c.setAttribute("cy","100");c.setAttribute("r","72");s.appendChild(c);
  var parts=D.date.split(","),dp=(parts.length>1?parts.slice(1).join(","):D.date).trim();
  var txt=("Happy birthday "+(D.nick||D.name||"")+" • "+dp+" • ").toUpperCase();
  var tx=document.createElementNS(NS,"text"),tp=document.createElementNS(NS,"textPath");
  tp.setAttribute("href","#rp");tp.setAttribute("textLength","546");tp.setAttribute("lengthAdjust","spacing");
  tp.textContent=txt;tx.appendChild(tp);s.appendChild(tx);
  b.insertBefore(s,b.firstChild);
}

function render(){
  $("nick").textContent="@"+D.nick;$("age").textContent=D.age;
  $("title").textContent="Hope you have the most beautiful day, "+D.name+" ❤️";
  $("intro").textContent=D.intro;$("date").textContent=D.date;
  $("gfor").textContent="For "+D.name;
  buildRing();renderStop1();renderStop2();
}
render();

/* Music: a soft built-in melody that starts when she taps the gift (browsers need a tap first) */
var AC=null,master=null,timer=null,step=0,playing=false;
var BASS=[62,57,59,54,55,50,55,57],CHD=[[62,66,69],[61,64,69],[62,66,71],[61,66,69],[62,67,71],[62,66,69],[62,67,71],[61,64,69]],MEL=[78,76,74,73,71,69,71,73,74,73,71,69,67,66,67,64];
function tone(m,t,d){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function pad(c,t){c.forEach(function(m){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=440*Math.pow(2,(m-12-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+1);g.gain.linearRampToValueAtTime(0,t+2.8);o.connect(g);g.connect(master);o.start(t);o.stop(t+2.9)})}
function tick(){var i=step%16,b=i>>1,cyc=Math.floor(step/16)%2,t=AC.currentTime+.05;if(i%2===0){tone(BASS[b],t,2.6);pad(CHD[b],t)}tone(cyc?CHD[b][i%2?1:2]+12:MEL[i],t,1.8);step++}
function startMusic(){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
  if(!master){master=AC.createGain();master.gain.value=.22;var d=AC.createDelay();d.delayTime.value=.45;var f=AC.createGain();f.gain.value=.42;master.connect(AC.destination);master.connect(d);d.connect(f);f.connect(d);f.connect(AC.destination)}
  clearInterval(timer);timer=setInterval(tick,680);playing=true;
}catch(e){playing=false}}
function stopMusic(){clearInterval(timer);playing=false}
function musIcon(){$("ico-on").classList.toggle("hide",!playing);$("ico-off").classList.toggle("hide",playing)}
$("gate").onclick=function(){
  var g=$("gate");g.classList.add("out");setTimeout(function(){g.classList.add("hide")},520);
  $("mus").classList.remove("hide");startMusic();musIcon();
};
$("mus").onclick=function(){if(playing)stopMusic();else startMusic();musIcon()};

/* Owner-only editor */
var FIELDS=[["name","Name"],["nick","Nickname"],["age","Age"],["date","Date"],["intro","Intro line"],
["r.name","Restaurant name"],["r.time","Restaurant time"],["r.place","Restaurant address"],["r.map","Restaurant map link"],["r.note","Restaurant note"],
["c.name","Cafe name"],["c.time","Cafe time"],["c.place","Cafe address"],["c.map","Cafe map link"],["c.note","Cafe note"],
["menuUrl","Menu link"],["whatsapp","Your WhatsApp number with country code (orders get sent here)"],["wish","Surprise message","area"]];
function get(p){var a=p.split(".");return a.length>1?D[a[0]][a[1]]:D[p]}
function set(p,v){var a=p.split(".");if(a.length>1)D[a[0]][a[1]]=v;else D[p]=v}
(async function(){
  try{
    if(!window.claude)return;
    var u=await claude.use("user");if(!u||!u.isOwner())return;
    var a=await claude.use("artifact");if(!a)return;
    $("editor").classList.remove("hide");var f=$("fields");
    FIELDS.forEach(function(x){var l=el("label",null,x[1]);var i=el(x[2]?"textarea":"input");i.id="f_"+x[0];i.value=get(x[0])||"";l.appendChild(i);f.appendChild(l)});
    $("reset").onclick=function(){
      ["arr1","arr2","order"].forEach(lr);
      $("surprise").classList.add("hide");$("s2").classList.remove("hide");render();
      $("msg").textContent="Progress reset on this device.";
    };
    $("save").onclick=async function(){
      var m=$("msg");m.textContent="Saving…";
      FIELDS.forEach(function(x){set(x[0],$("f_"+x[0]).value)});
      try{
        var src=await (await fetch(location.href.split("#")[0])).text();
        var j=JSON.stringify(D,null,1).replace(/</g,"\\u003c");
        var out=src.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,function(_,s,e){return s+"\n"+j+"\n"+e});
        await a.publish(out);
      }catch(e){m.textContent="Couldn’t save ("+(e&&e.code||"error")+"). Ask Claude to apply your changes."}
    };
  }catch(e){}
})();
</script>
